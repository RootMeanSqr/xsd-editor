# XE-081 forbids shipping a dependency with a known unfixed vulnerability, and every
# dependency is inside the installed artifact with no runtime update path — so an update
# has to reach us before a release, not after. Dependabot raises the pull request; the
# CVE, licence and trim-safety checks in AGENTS.md still apply to it like any other.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
